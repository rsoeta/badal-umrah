name: Deploy to hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy latest main on hosting
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu

          : "${SSH_HOST:?Set the SSH_HOST GitHub Actions secret}"
          : "${SSH_USER:?Set the SSH_USER GitHub Actions secret}"
          : "${SSH_PRIVATE_KEY:?Set the SSH_PRIVATE_KEY GitHub Actions secret}"
          : "${SSH_KNOWN_HOSTS:?Set the SSH_KNOWN_HOSTS GitHub Actions secret}"
          : "${DEPLOY_PATH:?Set the DEPLOY_PATH GitHub Actions secret}"
          SSH_PORT="${SSH_PORT:-22}"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          REMOTE_COMMAND="export PATH=\"\$HOME/bin:\$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:/opt/cpanel/composer/bin:\$PATH\" && cd $(printf '%q' "$DEPLOY_PATH") && git pull --ff-only origin main && if command -v composer >/dev/null 2>&1; then composer install --no-dev --prefer-dist --optimize-autoloader; elif [ -x /usr/local/bin/composer ]; then /usr/local/bin/composer install --no-dev --prefer-dist --optimize-autoloader; elif [ -x /opt/cpanel/composer/bin/composer ]; then /opt/cpanel/composer/bin/composer install --no-dev --prefer-dist --optimize-autoloader; else echo 'Composer tidak ditemukan di PATH, melanjutkan dengan dependensi yang sudah ada.'; fi && if command -v php >/dev/null 2>&1 && [ -f spark ]; then php spark migrate --no-header || true; php spark cache:clear || true; fi"

          ssh -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "$REMOTE_COMMAND"
