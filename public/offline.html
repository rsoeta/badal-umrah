<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a2c2f">
    <title>Sedang Offline — Badal Umrah</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, #36393f 0%, #2a2c2f 55%, #1e2023 100%);
            color: #eef0f2;
        }

        .offline-pane {
            width: 100%;
            max-width: 440px;
            padding: 32px 24px;
            border-radius: 26px;
            background: rgba(54, 57, 62, 0.78);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.14),
                inset 1px 1px 0 rgba(255, 255, 255, 0.24),
                0 18px 44px rgba(0, 0, 0, 0.36);
            text-align: center;
        }

        .offline-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(223, 184, 108, 0.16);
            box-shadow: inset 0 0 0 1px rgba(223, 184, 108, 0.44);
            color: #f6ddb0;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        p {
            margin: 0 0 24px;
            font-size: 0.94rem;
            line-height: 1.55;
            color: #c8cdd4;
        }

        .offline-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .btn-retry {
            border: 0;
            border-radius: 999px;
            padding: 11px 22px;
            font-size: 0.92rem;
            font-weight: 600;
            background: #dfb86c;
            color: #17191c;
            cursor: pointer;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 999px;
            padding: 11px 22px;
            font-size: 0.92rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
        }
    </style>
</head>
<body>
    <main class="offline-pane">
        <div class="offline-icon" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="2" y1="2" x2="22" y2="22"></line>
                <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
                <path d="M5 12.859a10 10 0 0 1 5.17-2.69"></path>
                <path d="M19 12.859a10 10 0 0 0-2.007-1.523"></path>
                <path d="M2 8.82a15 15 0 0 1 4.177-2.643"></path>
                <path d="M22 8.82a15 15 0 0 0-11.288-3.764"></path>
                <circle cx="12" cy="20" r="1"></circle>
            </svg>
        </div>
        <h1>Tidak Ada Koneksi Internet</h1>
        <p>
            Aplikasi Badal Umrah memerlukan koneksi internet untuk memuat data pendaftaran, sertifikat terbaru, atau panel admin.
        </p>
        <div class="offline-actions">
            <button type="button" class="btn-retry" onclick="window.location.reload()">Coba Muat Ulang</button>
            <a href="./" class="btn-home">Ke Beranda</a>
        </div>
    </main>
</body>
</html>
